openapi: 3.1.0
info:
  title: Postman API (Test Suites) Collections API
  description: Subset of the Postman API used to manage Postman Collections, which act as organizational test suites that group related API test cases. Base URL https://api.getpostman.com, authenticated with the X-Api-Key header.
  version: v1
  contact:
    name: Postman API
    url: https://learning.postman.com/docs/collections/collections-overview/
servers:
- url: https://api.getpostman.com
security:
- apiKey: []
tags:
- name: Collections
paths:
  /collections:
    get:
      summary: List collections (test suites)
      operationId: listCollections
      responses:
        '200':
          description: Collections listed.
      tags:
      - Collections
    post:
      summary: Create a collection
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                collection:
                  type: object
      responses:
        '200':
          description: Collection created.
      tags:
      - Collections
  /collections/{collection_uid}:
    get:
      summary: Get a collection
      operationId: getCollection
      parameters:
      - name: collection_uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Collection returned.
      tags:
      - Collections
    put:
      summary: Update a collection
      operationId: updateCollection
      parameters:
      - name: collection_uid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Collection updated.
      tags:
      - Collections
    delete:
      summary: Delete a collection
      operationId: deleteCollection
      parameters:
      - name: collection_uid
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Collection deleted.
      tags:
      - Collections
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
